<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reportes — Santiso Marketing</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap');
  :root{
    --bg:#15131F; --surface:#1C1A29; --border:#332E45;
    --text:#F1F0EE; --text-muted:#9A97A6; --text-faint:#6E6B7C; --gold:#D5A84E;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Manrope',system-ui,sans-serif;
    padding-inline:20px; padding-block:60px; max-width:720px; margin-inline:auto;
    font-size:15px; line-height:1.6;
  }
  a{color:inherit;}
  h1{font-family:'Fraunces',Georgia,serif; font-weight:500; font-size:clamp(28px,5vw,40px); margin:0 0 12px;}
  .lead{color:var(--text-muted); font-size:16px; margin-bottom:40px;}
  .list{display:flex; flex-direction:column; gap:2px;}
  .row{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:18px 20px; background:var(--surface); border:1px solid var(--border); border-radius:12px;
    text-decoration:none; color:var(--text); margin-bottom:10px;
  }
  .row .name{font-family:'Fraunces',Georgia,serif; font-size:18px;}
  .row .arrow{color:var(--gold); font-size:16px;}
  footer{margin-top:50px; font-size:11.5px; color:var(--text-faint); text-align:center;}
</style>
<body>
  <h1>Reportes de clientes</h1>
  <p class="lead">Santiso Marketing — el estado de tu contenido, siempre a mano.</p>
  <div class="list">
    <a class="row" href="/quilatz/">
      <span class="name">Quilatz</span>
      <span class="arrow">↗</span>
    </a>
    <a class="row" href="/torivac/">
      <span class="name">Torivac</span>
      <span class="arrow">↗</span>
    </a>
  </div>
  <footer>Santiso Marketing</footer>
</body></html>
